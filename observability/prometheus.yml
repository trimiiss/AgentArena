# Prometheus configuration for the Compose stack. Kubernetes uses k8s/observability/.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: identity-service
    static_configs:
      - targets: ["identity-service:8000"]
        labels: { component: api }

  - job_name: agent-registry
    static_configs:
      - targets: ["agent-registry:8000"]
        labels: { component: api }

  - job_name: scenario-service
    static_configs:
      - targets: ["scenario-service:8000"]
        labels: { component: api }

  - job_name: run-orchestrator
    static_configs:
      - targets: ["run-orchestrator:8000"]
        labels: { component: api }
      - targets: ["run-orchestrator-scheduler:8000"]
        labels: { component: scheduler }

  # DNS discovery finds every replica after: docker compose up --scale run-orchestrator-worker=3
  - job_name: run-orchestrator-worker
    dns_sd_configs:
      - names: ["run-orchestrator-worker"]
        type: A
        port: 8000
        refresh_interval: 10s
    relabel_configs:
      - target_label: component
        replacement: worker

  - job_name: evaluation-service
    static_configs:
      - targets: ["evaluation-service:8000"]
        labels: { component: api }
      - targets: ["evaluation-service-consumer:8000"]
        labels: { component: consumer }

  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
