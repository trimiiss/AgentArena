# Traces are viewed in Jaeger's own UI on port 16686. Grafana's Jaeger datasource
# needs an API that Jaeger 2.x no longer serves, so it is deliberately not listed.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 10s
