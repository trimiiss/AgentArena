[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentarena-common"
version = "1.0.0"
description = "Cross-cutting infrastructure shared by AgentArena services. Contains no domain logic."
requires-python = ">=3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "email-validator",
  # 2.1 is not yet supported by the OpenTelemetry instrumentation.
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg",
  "alembic",
  "aio-pika",
  "httpx",
  "pyjwt[crypto]",
  "cryptography",
  "prometheus-client",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-grpc",
  "opentelemetry-instrumentation-fastapi",
  "opentelemetry-instrumentation-httpx",
  "opentelemetry-instrumentation-sqlalchemy",
]

[tool.setuptools.packages.find]
include = ["agentarena_common*"]
