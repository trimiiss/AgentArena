openapi: 3.1.0
info:
  title: AgentArena Run Orchestrator
  description: Accepts simulation runs and tracks their executions.
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - operations
      summary: Liveness check
      description: 'Liveness: the process is running. Dependencies are not checked here,

        otherwise a database outage would restart every pod.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /ready:
    get:
      tags:
      - operations
      summary: Readiness check
      description: 'Readiness: this replica can do useful work right now.'
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Ready Ready Get
  /v1/runs:
    post:
      tags:
      - runs
      summary: Create Run
      description: 'Accepts a run for asynchronous execution.


        Send an Idempotency-Key header to make retries safe: repeating the request

        returns the original run instead of starting another one.'
      operationId: create_run_v1_runs_post
      parameters:
      - name: idempotency-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Idempotency-Key
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreate'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - runs
      summary: List Runs
      operationId: list_runs_v1_runs_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: agent_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Agent Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/runs/stats:
    get:
      tags:
      - runs
      summary: Run Stats
      operationId: run_stats_v1_runs_stats_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStats'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/runs/{run_id}:
    get:
      tags:
      - runs
      summary: Get Run
      operationId: get_run_v1_runs__run_id__get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/runs/{run_id}/cancel:
    post:
      tags:
      - runs
      summary: Cancel Run
      operationId: cancel_run_v1_runs__run_id__cancel_post
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/runs/{run_id}/replay:
    post:
      tags:
      - runs
      summary: Replay Run
      description: Repeats a run with the same agent version, scenario versions and seed.
      operationId: replay_run_v1_runs__run_id__replay_post
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/runs/{run_id}/executions:
    get:
      tags:
      - executions
      summary: List Executions
      operationId: list_executions_v1_runs__run_id__executions_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 200
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/executions/{execution_id}:
    get:
      tags:
      - executions
      summary: Get Execution
      operationId: get_execution_v1_executions__execution_id__get
      parameters:
      - name: execution_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Execution Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/runs/{run_id}/stream:
    get:
      tags:
      - runs
      summary: Live progress as Server-Sent Events
      operationId: stream_run_v1_runs__run_id__stream_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ExecutionDetail:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        run_id:
          type: string
          format: uuid
          title: Run Id
        scenario_id:
          type: string
          format: uuid
          title: Scenario Id
        scenario_version:
          type: integer
          title: Scenario Version
        scenario_name:
          type: string
          title: Scenario Name
        scenario_type:
          type: string
          title: Scenario Type
        difficulty:
          type: string
          title: Difficulty
        repetition:
          type: integer
          title: Repetition
        seed:
          type: integer
          title: Seed
        status:
          type: string
          title: Status
        attempt:
          type: integer
          title: Attempt
        max_attempts:
          type: integer
          title: Max Attempts
        worker_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Worker Id
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        latency_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Latency Ms
        queue_wait_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Queue Wait Ms
        agent_calls:
          type: integer
          title: Agent Calls
        tool_calls:
          type: integer
          title: Tool Calls
        input_tokens:
          type: integer
          title: Input Tokens
        output_tokens:
          type: integer
          title: Output Tokens
        cost_usd:
          anyOf:
          - type: number
          - type: 'null'
          title: Cost Usd
        passed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Passed
        score:
          anyOf:
          - type: number
          - type: 'null'
          title: Score
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
        dispatched_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Dispatched At
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finished At
        evaluated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Evaluated At
        agent_id:
          type: string
          format: uuid
          title: Agent Id
        agent_version:
          type: integer
          title: Agent Version
        agent_name:
          type: string
          title: Agent Name
        run_name:
          type: string
          title: Run Name
        steps:
          items:
            $ref: '#/components/schemas/StepOut'
          type: array
          title: Steps
      type: object
      required:
      - id
      - run_id
      - scenario_id
      - scenario_version
      - scenario_name
      - scenario_type
      - difficulty
      - repetition
      - seed
      - status
      - attempt
      - max_attempts
      - worker_id
      - error_code
      - error_message
      - latency_ms
      - queue_wait_ms
      - agent_calls
      - tool_calls
      - input_tokens
      - output_tokens
      - cost_usd
      - passed
      - score
      - trace_id
      - dispatched_at
      - started_at
      - finished_at
      - evaluated_at
      - agent_id
      - agent_version
      - agent_name
      - run_name
      - steps
      title: ExecutionDetail
    ExecutionList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ExecutionOut'
          type: array
          title: Items
        total:
          type: integer
          title: Total
      type: object
      required:
      - items
      - total
      title: ExecutionList
    ExecutionOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        run_id:
          type: string
          format: uuid
          title: Run Id
        scenario_id:
          type: string
          format: uuid
          title: Scenario Id
        scenario_version:
          type: integer
          title: Scenario Version
        scenario_name:
          type: string
          title: Scenario Name
        scenario_type:
          type: string
          title: Scenario Type
        difficulty:
          type: string
          title: Difficulty
        repetition:
          type: integer
          title: Repetition
        seed:
          type: integer
          title: Seed
        status:
          type: string
          title: Status
        attempt:
          type: integer
          title: Attempt
        max_attempts:
          type: integer
          title: Max Attempts
        worker_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Worker Id
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        latency_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Latency Ms
        queue_wait_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Queue Wait Ms
        agent_calls:
          type: integer
          title: Agent Calls
        tool_calls:
          type: integer
          title: Tool Calls
        input_tokens:
          type: integer
          title: Input Tokens
        output_tokens:
          type: integer
          title: Output Tokens
        cost_usd:
          anyOf:
          - type: number
          - type: 'null'
          title: Cost Usd
        passed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Passed
        score:
          anyOf:
          - type: number
          - type: 'null'
          title: Score
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
        dispatched_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Dispatched At
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finished At
        evaluated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Evaluated At
      type: object
      required:
      - id
      - run_id
      - scenario_id
      - scenario_version
      - scenario_name
      - scenario_type
      - difficulty
      - repetition
      - seed
      - status
      - attempt
      - max_attempts
      - worker_id
      - error_code
      - error_message
      - latency_ms
      - queue_wait_ms
      - agent_calls
      - tool_calls
      - input_tokens
      - output_tokens
      - cost_usd
      - passed
      - score
      - trace_id
      - dispatched_at
      - started_at
      - finished_at
      - evaluated_at
      title: ExecutionOut
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Progress:
      properties:
        total:
          type: integer
          title: Total
        pending:
          type: integer
          title: Pending
          default: 0
        dispatched:
          type: integer
          title: Dispatched
          default: 0
        running:
          type: integer
          title: Running
          default: 0
        retry_wait:
          type: integer
          title: Retry Wait
          default: 0
        completed:
          type: integer
          title: Completed
          default: 0
        failed:
          type: integer
          title: Failed
          default: 0
        timed_out:
          type: integer
          title: Timed Out
          default: 0
        cancelled:
          type: integer
          title: Cancelled
          default: 0
        evaluated:
          type: integer
          title: Evaluated
          default: 0
        passed:
          type: integer
          title: Passed
          default: 0
      type: object
      required:
      - total
      title: Progress
    RunCreate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Name
        agent_id:
          type: string
          format: uuid
          title: Agent Id
        agent_version:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Agent Version
          description: Defaults to the latest version.
        suite_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Suite Id
        scenario_ids:
          anyOf:
          - items:
              type: string
              format: uuid
            type: array
            maxItems: 200
            minItems: 1
          - type: 'null'
          title: Scenario Ids
        repetitions:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Repetitions
          default: 1
        concurrency:
          type: integer
          maximum: 64.0
          minimum: 1.0
          title: Concurrency
          default: 4
        timeout_seconds:
          type: number
          maximum: 300.0
          minimum: 1.0
          title: Timeout Seconds
          default: 30
        max_retries:
          type: integer
          maximum: 5.0
          minimum: 0.0
          title: Max Retries
          default: 1
        seed:
          anyOf:
          - type: integer
            maximum: 2147483647.0
            minimum: 0.0
          - type: 'null'
          title: Seed
        judge_enabled:
          type: boolean
          title: Judge Enabled
          default: false
      type: object
      required:
      - agent_id
      title: RunCreate
    RunList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/RunOut'
          type: array
          title: Items
        total:
          type: integer
          title: Total
      type: object
      required:
      - items
      - total
      title: RunList
    RunOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        org_id:
          type: string
          format: uuid
          title: Org Id
        name:
          type: string
          title: Name
        status:
          type: string
          title: Status
        agent_id:
          type: string
          format: uuid
          title: Agent Id
        agent_name:
          type: string
          title: Agent Name
        agent_version:
          type: integer
          title: Agent Version
        suite_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Suite Id
        seed:
          type: integer
          title: Seed
        concurrency:
          type: integer
          title: Concurrency
        timeout_seconds:
          type: number
          title: Timeout Seconds
        max_retries:
          type: integer
          title: Max Retries
        repetitions:
          type: integer
          title: Repetitions
        judge_enabled:
          type: boolean
          title: Judge Enabled
        total_executions:
          type: integer
          title: Total Executions
        correlation_id:
          type: string
          title: Correlation Id
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
        replay_of:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Replay Of
        warning:
          anyOf:
          - type: string
          - type: 'null'
          title: Warning
        created_at:
          type: string
          format: date-time
          title: Created At
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
        finished_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finished At
        progress:
          $ref: '#/components/schemas/Progress'
      type: object
      required:
      - id
      - org_id
      - name
      - status
      - agent_id
      - agent_name
      - agent_version
      - suite_id
      - seed
      - concurrency
      - timeout_seconds
      - max_retries
      - repetitions
      - judge_enabled
      - total_executions
      - correlation_id
      - trace_id
      - replay_of
      - warning
      - created_at
      - started_at
      - finished_at
      - progress
      title: RunOut
    RunStats:
      properties:
        total_runs:
          type: integer
          title: Total Runs
        active_runs:
          type: integer
          title: Active Runs
        completed_runs:
          type: integer
          title: Completed Runs
        failed_runs:
          type: integer
          title: Failed Runs
        cancelled_runs:
          type: integer
          title: Cancelled Runs
        total_executions:
          type: integer
          title: Total Executions
        finished_executions:
          type: integer
          title: Finished Executions
      type: object
      required:
      - total_runs
      - active_runs
      - completed_runs
      - failed_runs
      - cancelled_runs
      - total_executions
      - finished_executions
      title: RunStats
    StepOut:
      properties:
        attempt:
          type: integer
          title: Attempt
        seq:
          type: integer
          title: Seq
        type:
          type: string
          title: Type
        latency_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Latency Ms
        payload:
          additionalProperties: true
          type: object
          title: Payload
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - attempt
      - seq
      - type
      - latency_ms
      - payload
      - created_at
      title: StepOut
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
