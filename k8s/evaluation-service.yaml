apiVersion: v1
kind: Service
metadata:
  name: evaluation-service
  namespace: agentarena
  labels:
    app.kubernetes.io/name: evaluation-service
spec:
  selector:
    app.kubernetes.io/name: evaluation-service
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: agentarena
  labels:
    app.kubernetes.io/name: evaluation-service
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: evaluation-service
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evaluation-service
        app.kubernetes.io/component: api
        agentarena.io/database: "true"
        agentarena.io/verifies-tokens: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: agentarena/evaluation-service:local
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env: &env
            - name: EVALUATIONS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: agentarena-secrets, key: EVALUATIONS_DB_PASSWORD } }
            - name: DATABASE_URL
              value: postgresql+asyncpg://evaluations_svc:$(EVALUATIONS_DB_PASSWORD)@postgres:5432/evaluations_db
          securityContext: &container-security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
      containers:
        - name: evaluation-service
          image: agentarena/evaluation-service:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "evaluation_service.main:app", "--host", "0.0.0.0", "--port", "8000", "--timeout-graceful-shutdown", "20"]
          envFrom:
            - configMapRef:
                name: agentarena-config
          env: *env
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: { cpu: 100m, memory: 160Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext: *container-security
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service-consumer
  namespace: agentarena
  labels:
    app.kubernetes.io/name: evaluation-service
    app.kubernetes.io/component: consumer
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: evaluation-service
      app.kubernetes.io/component: consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evaluation-service
        app.kubernetes.io/component: consumer
        agentarena.io/database: "true"
        agentarena.io/broker: "true"
        # Only needed for the optional judge, which calls an external API.
        agentarena.io/external-https: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: evaluation-service-consumer
          image: agentarena/evaluation-service:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "evaluation_service.consumer"]
          envFrom:
            - configMapRef:
                name: agentarena-config
          env:
            - name: SERVICE_NAME
              value: evaluation-service-consumer
            - name: EVALUATIONS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: agentarena-secrets, key: EVALUATIONS_DB_PASSWORD } }
            - name: DATABASE_URL
              value: postgresql+asyncpg://evaluations_svc:$(EVALUATIONS_DB_PASSWORD)@postgres:5432/evaluations_db
            - name: RABBITMQ_USER
              valueFrom: { secretKeyRef: { name: agentarena-secrets, key: RABBITMQ_USER } }
            - name: RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: agentarena-secrets, key: RABBITMQ_PASSWORD } }
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672/agentarena
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: agentarena-secrets, key: ANTHROPIC_API_KEY, optional: true } }
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 160Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
