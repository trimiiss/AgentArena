apiVersion: v1
kind: Service
metadata:
  name: scenario-service
  namespace: agentarena
  labels:
    app.kubernetes.io/name: scenario-service
spec:
  selector:
    app.kubernetes.io/name: scenario-service
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenario-service
  namespace: agentarena
  labels:
    app.kubernetes.io/name: scenario-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: scenario-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scenario-service
        agentarena.io/database: "true"
        agentarena.io/verifies-tokens: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: agentarena/scenario-service:local
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env: &env
            - name: SCENARIOS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: agentarena-secrets, key: SCENARIOS_DB_PASSWORD } }
            - name: DATABASE_URL
              value: postgresql+asyncpg://scenarios_svc:$(SCENARIOS_DB_PASSWORD)@postgres:5432/scenarios_db
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: agentarena-secrets, key: INTERNAL_SERVICE_TOKEN } }
          securityContext: &container-security
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
      containers:
        - name: scenario-service
          image: agentarena/scenario-service:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "scenario_service.main:app", "--host", "0.0.0.0", "--port", "8000", "--timeout-graceful-shutdown", "20"]
          envFrom:
            - configMapRef:
                name: agentarena-config
          env: *env
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: *container-security
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
