apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: agentarena-observability
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - { name: otlp, port: 4317 }
    - { name: ui, port: 16686 }
---
# Keeps traces in memory, which suits local work. Production needs a storage backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: agentarena-observability
  labels:
    app.kubernetes.io/name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.23.0
          ports:
            - containerPort: 4317
            - containerPort: 16686
          readinessProbe:
            httpGet: { path: /, port: 16686 }
          livenessProbe:
            httpGet: { path: /, port: 16686 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
