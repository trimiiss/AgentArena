apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: agentarena-observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      memory_limiter:
        check_interval: 2s
        limit_mib: 200
        spike_limit_mib: 50
      batch:
        timeout: 2s
        send_batch_size: 512
    exporters:
      otlp_grpc/jaeger:
        endpoint: jaeger:4317
        tls:
          insecure: true
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp_grpc/jaeger]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: agentarena-observability
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - { name: otlp, port: 4317 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: agentarena-observability
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.164.0
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - containerPort: 4317
            - containerPort: 13133
          readinessProbe:
            httpGet: { path: /, port: 13133 }
          livenessProbe:
            httpGet: { path: /, port: 13133 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 320Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
      volumes:
        - name: config
          configMap:
            name: otel-collector
