apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agentarena
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
---
# One instance keeps local resource use low. Every service still has its own
# database and role, so splitting them later needs only a new connection string.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: agentarena
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17.11-alpine3.24
          args: ["-c", "max_connections=300"]
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: agentarena-secrets, key: POSTGRES_PASSWORD } }
            - name: IDENTITY_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: agentarena-secrets, key: IDENTITY_DB_PASSWORD } }
            - name: AGENTS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: agentarena-secrets, key: AGENTS_DB_PASSWORD } }
            - name: SCENARIOS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: agentarena-secrets, key: SCENARIOS_DB_PASSWORD } }
            - name: RUNS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: agentarena-secrets, key: RUNS_DB_PASSWORD } }
            - name: EVALUATIONS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: agentarena-secrets, key: EVALUATIONS_DB_PASSWORD } }
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "evaluations_db"]
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: init
          configMap:
            name: postgres-init
            # Executable, so the entrypoint runs the script instead of sourcing it.
            defaultMode: 0555
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
