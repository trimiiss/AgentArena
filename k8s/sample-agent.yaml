apiVersion: v1
kind: Service
metadata:
  name: sample-agent
  namespace: agentarena
  labels:
    app.kubernetes.io/name: sample-agent
spec:
  selector:
    app.kubernetes.io/name: sample-agent
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-agent
  namespace: agentarena
  labels:
    app.kubernetes.io/name: sample-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-agent
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sample-agent
          image: agentarena/sample-agent:local
          imagePullPolicy: IfNotPresent
          env:
            - name: SAMPLE_AGENT_API_KEY
              valueFrom: { secretKeyRef: { name: agentarena-secrets, key: SAMPLE_AGENT_API_KEY } }
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
