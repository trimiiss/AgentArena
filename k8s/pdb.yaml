apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: run-orchestrator
  namespace: agentarena
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: run-orchestrator
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: run-orchestrator-worker
  namespace: agentarena
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: run-orchestrator
      app.kubernetes.io/component: worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-registry
  namespace: agentarena
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-registry
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: scenario-service
  namespace: agentarena
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scenario-service
