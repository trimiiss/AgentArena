apiVersion: v1
kind: Namespace
metadata:
  name: agentarena
  labels:
    # The restricted standard is enforced: pods that run as root are rejected.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: agentarena-observability
  labels:
    pod-security.kubernetes.io/enforce: baseline
