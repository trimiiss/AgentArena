# CPU tracks load well for the API. Workers mostly wait on agents, so CPU is only
# a rough signal for them. docs/loadtest.md measures this, and ADR 0009 names the
# better trigger: queue depth, through KEDA.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: run-orchestrator
  namespace: agentarena
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: run-orchestrator
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - { type: Pods, value: 2, periodSeconds: 30 }
    scaleDown:
      stabilizationWindowSeconds: 120
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: run-orchestrator-worker
  namespace: agentarena
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: run-orchestrator-worker
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - { type: Pods, value: 2, periodSeconds: 30 }
    scaleDown:
      stabilizationWindowSeconds: 180
---
# POST /v1/runs calls these two services on every submission. When only the API
# scaled, the Agent Registry hit its CPU limit and tripped the breaker: see
# docs/loadtest.md. A tier has to scale with whatever sits on its hot path.
# Utilization is relative to the 100m CPU request, so 150 means 150m per pod.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-registry
  namespace: agentarena
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-registry
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 150
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - { type: Pods, value: 2, periodSeconds: 30 }
    scaleDown:
      stabilizationWindowSeconds: 120
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scenario-service
  namespace: agentarena
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scenario-service
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 150
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - { type: Pods, value: 2, periodSeconds: 30 }
    scaleDown:
      stabilizationWindowSeconds: 120
