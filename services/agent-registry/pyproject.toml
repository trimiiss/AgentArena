[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-registry"
version = "1.0.0"
description = "Registers AI agents, their versions, endpoints and encrypted credentials."
requires-python = ">=3.13"
dependencies = ["agentarena-common"]

[tool.setuptools.packages.find]
include = ["agent_registry*"]
