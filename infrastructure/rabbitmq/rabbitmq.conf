# The built-in guest account can only connect from localhost.
loopback_users.guest = true

# Allow long executions to stay unacknowledged. Run timeouts are capped far below this.
consumer_timeout = 1800000

# Protect the broker from an unbounded backlog of large messages.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 256MB

log.console.level = warning
