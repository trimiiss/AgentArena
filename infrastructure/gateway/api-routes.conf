# Compose only: gives the browser one origin, as the ingress does in Kubernetes.
# /internal/ paths are deliberately absent, so they cannot be reached from outside.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_connect_timeout 3s;
proxy_read_timeout 30s;
client_max_body_size 2m;

resolver 127.0.0.11 valid=10s ipv6=off;

location /v1/auth { set $identity identity-service; proxy_pass http://$identity:8000; }
location /v1/organizations { set $identity identity-service; proxy_pass http://$identity:8000; }
location /v1/agents { set $registry agent-registry; proxy_pass http://$registry:8000; }
location /v1/scenarios { set $scenarios scenario-service; proxy_pass http://$scenarios:8000; }
location /v1/suites { set $scenarios scenario-service; proxy_pass http://$scenarios:8000; }
location /v1/datasets { set $scenarios scenario-service; proxy_pass http://$scenarios:8000; }
location /v1/executions { set $runs run-orchestrator; proxy_pass http://$runs:8000; }
location /v1/evaluations { set $evaluations evaluation-service; proxy_pass http://$evaluations:8000; }
location /v1/benchmarks { set $evaluations evaluation-service; proxy_pass http://$evaluations:8000; }
location /v1/comparisons { set $evaluations evaluation-service; proxy_pass http://$evaluations:8000; }
location /v1/analytics { set $evaluations evaluation-service; proxy_pass http://$evaluations:8000; }

location /v1/runs {
  set $runs run-orchestrator;
  proxy_pass http://$runs:8000;
  # Live progress is a long-lived stream that must not be buffered.
  proxy_buffering off;
  proxy_read_timeout 1h;
}
